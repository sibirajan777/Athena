[project]
name = "athena"
version = "0.1.0"
description = "Enterprise-Grade Agentic RAG Knowledge & Retrieval System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bcrypt>=4.2.0",
    "chromadb>=0.5.0",
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "pyjwt>=2.9.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "sentence-transformers>=3.0.0",
    "uvicorn[standard]>=0.30.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pydantic>=2.8.0"
]

[tool.vercel]
entrypoint = "api/index.py"
